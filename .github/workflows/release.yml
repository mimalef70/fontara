name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish verified packages
    needs: verification
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the packages tested by verification
        uses: actions/download-artifact@v8
        with:
          name: fontara-verified-packages
          path: build
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            build/*-prod.zip
            build/firefox-mv3-source-*.zip
