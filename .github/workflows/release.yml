name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: Verify packages, inspect Chrome status, submit a version tag, or increase its rollout
        type: choice
        options: [verify, status, submit, rollout]
        default: verify
      deploy_percentage:
        description: Target percentage (required for rollout; submit defaults to CWS_DEPLOY_PERCENTAGE or 10)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verification:
    if: github.event_name == 'push' || inputs.action == 'verify' || inputs.action == 'submit'
    uses: ./.github/workflows/verify.yml

  provenance-check:
    name: Verify live attestation service without publishing
    needs: verification
    if: github.repository == 'mimalef70/fontara' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fontara-verified-packages
          path: build
      - name: Prepare a branch-only verification subject
        run: node tasks/check-release-provenance.js --action prepare
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: provenance-check.json
      - name: Verify attestation identity and rejection by production tag policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tasks/check-release-provenance.js --action verify

  publish:
    name: Publish verified packages
    needs: verification
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.action == 'submit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: fontara-release-assets-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - name: Download the packages tested by verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fontara-verified-packages
          path: build
      - name: Verify release tag belongs to trusted master
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tasks/publish-firefox-store.js --action check-tag --tag "$GITHUB_REF_NAME"
      - name: Prepare versioned downloads, integrity checks, and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tasks/prepare-release-assets.js --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --directory build --output release-assets --check-existing
      - name: Attest durable release provenance after all verification gates
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/release-provenance.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          fail_on_unmatched_files: true
          overwrite_files: false
          name: FontARA ${{ github.ref_name }}
          body_path: release-assets/release-body.md
          files: |
            release-assets/*.zip
            release-assets/build-info.json
            release-assets/fontara-production-dependencies.cdx.json
            release-assets/release-provenance.json
            release-assets/SHA256SUMS

  chrome-store:
    name: Publish to Chrome Web Store
    needs: [verification, publish]
    if: >-
      always() && !cancelled() &&
      ((needs.verification.result == 'success' && needs.publish.result == 'success' &&
        (github.event_name == 'push' || inputs.action == 'submit')) ||
       inputs.action == 'status' || inputs.action == 'rollout')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CWS_ACTION: ${{ inputs.action || 'submit' }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
      CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
      CWS_DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage || vars.CWS_DEPLOY_PERCENTAGE || '10' }}
      REQUESTED_DEPLOY_PERCENTAGE: ${{ inputs.deploy_percentage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - name: Validate release action and publishing configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CWS_ACTION" != status && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo '::error::Select a version tag for Chrome submission or rollout.'
            exit 1
          fi
          if [[ "$CWS_ACTION" == rollout && -z "$REQUESTED_DEPLOY_PERCENTAGE" ]]; then
            echo '::error::Rollout requires an explicit deploy_percentage.'
            exit 1
          fi
          for setting in CWS_PUBLISHER_ID CWS_EXTENSION_ID CWS_WORKLOAD_IDENTITY_PROVIDER CWS_SERVICE_ACCOUNT; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing $setting. Complete the one-time setup in docs/release.md."
              exit 1
            fi
          done
      - name: Download the exact Chrome package tested by verification
        if: env.CWS_ACTION == 'submit'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fontara-verified-packages
          path: build
      - name: Verify publishing tag belongs to trusted master
        if: env.CWS_ACTION != 'status'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tasks/publish-firefox-store.js --action check-tag --tag "$GITHUB_REF_NAME"
      - name: Validate the verified ZIP and release tag before authentication
        if: env.CWS_ACTION == 'submit'
        run: node tasks/publish-chrome-store.js --action validate
      - name: Authenticate with a short-lived Google token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: ${{ env.CWS_ACTION == 'status' && 'https://www.googleapis.com/auth/chromewebstore.readonly' || 'https://www.googleapis.com/auth/chromewebstore' }}
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Run Chrome Web Store operation
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node tasks/publish-chrome-store.js --action "$CWS_ACTION"
